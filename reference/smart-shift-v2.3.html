--ok:#4ADE80;--ok-soft:#11301E;--warn:#FBBF24;--warn-soft:#33270E;--bad:#F87171;--bad-soft:#3A1A1F;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0D1420;--surface:#141D2C;--surface-2:#1A2537;--line:#253247;--line-2:#34445D;--fg:#E4EAF4;--muted:#97A6BC;
--accent:#3D78F2;--accent-strong:#7FA6FF;--accent-soft:#1C2B4C;--accent-fg:#FFFFFF;--ink:#DCE6FF;
--sun:#341C24;--sun-h:#45222C;--sun-fg:#FCA5A5;--sat:#172848;--sat-h:#1E345C;--sat-fg:#9CC3FF;
--ok:#4ADE80;--ok-soft:#11301E;--warn:#FBBF24;--warn-soft:#33270E;--bad:#F87171;--bad-soft:#3A1A1F;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;max-width:1600px;margin:0 auto}

h2{font-size:16px;font-weight:700;margin-bottom:12px}
h3{font-size:14px;font-weight:700}
p{margin:0}
a{color:var(--accent-strong)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}.small{font-size:12px}.xs{font-size:11px}.bold{font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}

.sc{padding:0;overflow:auto;max-height:78vh}

.b,.b2,.b3{border-radius:8px;padding:7px 15px;font-size:14px;font-weight:600;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:background .15s,transform .15s,box-shadow .15s;white-space:nowrap}
.b{background:var(--accent);color:var(--accent-fg);border:1px solid var(--accent)}

.b3:hover{background:var(--surface-2)}
.b.ok{background:var(--ok);border-color:var(--ok)}
.b2.danger,.b3.danger{color:var(--bad)}

.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.a{background:var(--accent-soft);color:var(--accent-strong)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

.brand b{font-size:18px;color:var(--ink);letter-spacing:-.01em}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}

.banner.warn{background:var(--warn-soft);border-color:transparent}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-size:26px;font-weight:700;line-height:1.3;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}

.g{border-collapse:separate;border-spacing:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.g td,.g th{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;font-size:12px;min-width:48px;padding:3px}
.g th{position:sticky;top:0;z-index:2;font-weight:600;background:var(--surface-2);line-height:1.35}
.g th.sun{background:var(--sun-h);color:var(--sun-fg)}.g th.sat{background:var(--sat-h);color:var(--sat-fg)}
.g td.n,.g th.n{position:sticky;left:0;background:var(--surface);min-width:118px;text-align:left;z-index:3;padding:6px 10px;border-right:2px solid var(--line-2)}
.g th.n{z-index:4;background:var(--surface-2)}
.cell{height:44px;transition:filter .15s;font-weight:600;font-size:12px;line-height:1.25}
.cell.ed{cursor:pointer}.cell.ed:hover{filter:brightness(.95)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cell.sun{background:var(--sun)}.cell.sat{background:var(--sat)}.cell.wk{background:var(--surface)}

.cell .m{color:var(--accent);font-size:9px}

/* ---- 保存（ローカル or 共有DB） ---- */
let saveT=null,saveN=0,dirty=false,writing=Promise.resolve();
function save(){
 if(mode==='db'){if(!isOwner)return;dirty=true;saveN++;clearTimeout(saveT);saveT=setTimeout(flush,700)}
 else LS.set('ssm7',S)}
function flush(){const n=saveN,body=JSON.parse(JSON.stringify(S));
 writing=writing.then(()=>DB.doc('app/config').set(body)).then(()=>{if(n===saveN)dirty=false},e=>{if(n===saveN)dirty=false;toast('保存できませんでした：'+(e&&e.message||'通信エラー'))})}
const REQ={
 async add(r){r.id='q'+Date.now()+Math.random().toString(36).slice(2,6);r.createdAt=new Date().toISOString();if(myUid)r.uid=myUid;
  if(DB){try{await DB.collection('reqs').doc(r.id).set(r)}catch(e){toast('送信できませんでした：'+(e.message||e.code));return false}}
  else{R.push(r);LS.set('ssm7_reqs',R);render()}return true},
 async upd(id,p){if(DB){try{await DB.doc('reqs/'+id).update(p)}catch(e){toast('更新できませんでした：'+(e.message||e.code));return false}}
  else{const r=R.find(x=>x.id===id);if(r)Object.assign(r,p);LS.set('ssm7_reqs',R);render()}return true},
 async del(id){if(DB){try{await DB.doc('reqs/'+id).delete()}catch(e){toast('削除できませんでした');return}}else{R=R.filter(x=>x.id!==id);LS.set('ssm7_reqs',R);render()}}};

/* ===================== プラン ===================== */
function trialLeft(){const a=pd(S.plan.trialStart||iso(new Date())),e=new Date(a.getFullYear(),a.getMonth()+2,a.getDate());return Math.ceil((e-todayD())/864e5)}
function tier(){const p=S.plan.tier;return p==='trial'?(trialLeft()>0?'pro':'free'):(PLANS[p]?p:'free')}
const can=f=>RANK[tier()]>=RANK[FEAT[f][0]];
const staffLimit=()=>PLANS[tier()].staff;
function lockedCard(f,inline){const p=PLANS[FEAT[f][0]];
 return`<div class="card"><div class="lockc"><div class="ic">${icon('lock')}</div><div style="flex:1 1 240px;min-width:0"><h3>${FEAT[f][1]}は${p.name}プランから使えます</h3><p class="muted small">月額 ${yen(p.m)}（税込）。年払いなら2ヶ月分お得です。</p></div>${adminOK?`<button class="b" onclick="go(6)">プランを見る</button>`:'<span class="chip">管理者にお問い合わせください</span>'}</div></div>`}
function icon(n){const P={lock:'<rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'};return`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-strong)">${P[n]}</svg>`}

/* ===================== 期間 ===================== */
function norm(){const d=pd(curStart);if(S.span==='m1')curStart=iso(new Date(d.getFullYear(),d.getMonth(),1));else{const w=(d.getDay()+6)%7;curStart=iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()-w))}}
const pstart=()=>pd(curStart);
const dim=()=>{const a=pstart();return S.span==='m1'?new Date(a.getFullYear(),a.getMonth()+1,0).getDate():SPN[S.span]};
const dt=d=>{const a=pstart();return new Date(a.getFullYear(),a.getMonth(),a.getDate()+d-1)};
const dow=d=>dt(d).getDay(),dk=d=>iso(dt(d)),dom=d=>dt(d).getDate(),mon=d=>dt(d).getMonth()+1;
const isHol=d=>HOL.has(dk(d)),holSun=d=>isHol(d)||dow(d)===0;
const dcls=d=>holSun(d)?'sun':dow(d)===6?'sat':'wk';
const dlabel=d=>d===1||dom(d)===1?mon(d)+'/'+dom(d):String(dom(d));
function reset(){sel=null;resDay=null;render()}
function nav(k){const d=pstart();curStart=iso(S.span==='m1'?new Date(d.getFullYear(),d.getMonth()+k,1):new Date(d.getFullYear(),d.getMonth(),d.getDate()+k*dim()));reset()}
function goToday(){curStart=iso(new Date());norm();reset()}
function setSpan(v){S.span=v;norm();save();reset()}
function plabel(){const a=dt(1),b=dt(dim());return S.span==='m1'?`${a.getFullYear()}年${a.getMonth()+1}月`:`${a.getMonth()+1}/${a.getDate()} 〜 ${b.getMonth()+1}/${b.getDate()}`}
function ptitle(){const a=dt(1),b=dt(dim());return S.span==='m1'?`${a.getFullYear()}年${a.getMonth()+1}月`:`${a.getFullYear()}年${a.getMonth()+1}月${a.getDate()}日〜${b.getMonth()+1}月${b.getDate()}日`}
function navBar(){return`<div class="row"><button class="b2" onclick="nav(-1)" aria-label="前の期間">◀</button><b style="min-width:9rem;text-align:center;font-size:17px">${plabel()}</b><button class="b2" onclick="nav(1)" aria-label="次の期間">▶</button><button class="b2" onclick="goToday()">今日</button><span class="chip">${SPL[S.span]}</span></div>`}
const isPub=d=>!!S.pubUntil&&dk(d)<=S.pubUntil;

/* ===================== シフト計算 ===================== */
const offId=()=>(S.shifts.find(s=>s.name==='休み')||S.shifts[S.shifts.length-1]||{}).id;
const isPL=id=>id==='PL'||id==='PLH';
const sh=id=>id==='PL'?PL:id==='PLH'?PLH:S.shifts.find(s=>s.id===id);
const isWork=id=>!!id&&id!==offId()&&!isPL(id)&&!!sh(id);
const gvd=(sid,date)=>(S.grid[sid]||{})[date];
const gv=(st,d)=>gvd(st.id,dk(d));
const wv=(st,d)=>!!(S.wish[st.id]&&S.wish[st.id][dk(d)]);
function tm(s){if(!s||!s.time)return null;const m=String(s.time).match(/(\d+):(\d+)\s*[-〜~]\s*(翌)?(\d+):(\d+)/);if(!m)return null;let a=+m[1]+m[2]/60,b=+m[4]+m[5]/60;if(m[3]||b<=a)b+=24;return{a,b}}
/* 休憩：未設定なら 6h超45分・8h超60分（労基法34条） */
function hrs(s){const t=tm(s);if(!t)return 0;const h=t.b-t.a;const br=s.brk!=null&&s.brk!==''?+s.brk:(h>8?1:h>6?.75:0);return Math.max(0,h-br)}
function nightH(s){const t=tm(s);if(!t)return 0;const ov=(x,y)=>Math.max(0,Math.min(t.b,y)-Math.max(t.a,x));return Math.min(hrs(s),ov(0,5)+ov(22,29)+ov(46,53))}
function cellCost(st,id){if(isPL(id))return(id==='PL'?+st.plHours||8:(+st.plHours||8)/2)*st.wage;if(!isWork(id))return 0;const s=sh(id);return(hrs(s)+.25*nightH(s))*st.wage}
function needOn(date){const d=pd(date),w=d.getDay();return(+S.need[w]||0)+(w===5?+S.bonus.fri||0:0)+(w===6?+S.bonus.sat||0:0)}
const workingOn=date=>S.staff.filter(s=>isWork(gvd(s.id,date))).length;
function U(path,v,num){const p=path.split('.');let o=S;for(let i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}o[p[p.length-1]]=num?(+v||0):v;save();render()}

function parsePat(txt){const out=[];String(txt).split(/[,、→>]/).forEach(x=>{const m=x.trim().match(/^(.+?)[×x*](\d+)$/),nm=m?m[1].trim():x.trim(),n=m?+m[2]:1,s=S.shifts.find(s=>s.name===nm);if(s)for(let i=0;i<n;i++)out.push(s.id)});return out}
function gen(){const D=dim(),off=offId(),G=S.grid,lim=staffLimit();
 const pool=S.staff.slice(0,lim===Infinity?S.staff.length:lim);
 pool.forEach(st=>{G[st.id]=G[st.id]||{};for(let d=1;d<=D;d++){if(!isPL(G[st.id][dk(d)]))delete G[st.id][dk(d)]}});
 const set=(st,d,v)=>{if(!isPL(gv(st,d)))G[st.id][dk(d)]=v},wk=(st,d)=>isWork(gv(st,d)),ab=d=>Math.round((dt(d)-new Date(2026,0,1))/864e5);
 pool.forEach((st,i)=>{for(let d=1;d<=D;d++){if(isPL(gv(st,d)))continue;if(wv(st,d)){set(st,d,off);continue}
  if(st.mode==='w'){const f=(st.fix||{})[dow(d)];set(st,d,f&&sh(f)?f:off)}
  else if(st.mode!==''){const q=parsePat(S.pats[+st.mode]||'');set(st,d,q.length?q[(((ab(d)+i*2)%q.length)+q.length)%q.length]:off)}}});
 const free=pool.filter(s=>s.mode===''),dayS=(S.shifts.find(s=>isWork(s.id)&&!s.min&&s.time)||S.shifts[0]).id,maxRun=+S.rules.maxRun||6;
 const tot=(s,d)=>{let n=0;for(let k=1;k<d;k++)if(wk(s,k))n++;return n};
 for(let d=1;d<=D;d++){const cnt=id=>pool.filter(s=>gv(s,d)===id).length;
  const lastDays=new Date(dt(d).getFullYear(),dt(d).getMonth()+1,0).getDate();
  const need=needOn(dk(d))+(dom(d)>lastDays-3?+S.bonus.end||0:0);
  const cand=()=>free.filter(s=>!gv(s,d)&&!wv(s,d)).filter(s=>{const p=sh(gv(s,d-1));return!(p&&p.ake)}).filter(s=>{for(let k=1;k<=maxRun;k++)if(!wk(s,d-k))return true;return false}).sort((a,b)=>tot(a,d)-tot(b,d));
  S.shifts.forEach(x=>{if(!isWork(x.id))return;while(cnt(x.id)<(+x.min||0)){const c=cand()[0];if(!c)break;set(c,d,x.id)}});
  while(pool.filter(s=>wk(s,d)).length<need){const c=cand()[0];if(!c)break;set(c,d,dayS)}
  free.forEach(s=>{if(!gv(s,d))set(s,d,off)})}
 save();msg='自動生成しました。承認済みの有給・希望休・固定曜日・巡回パターンを守り、必要人数と出勤日数の偏りを調整しています。';render()}

function stats(){const D=dim();return S.staff.map(st=>{let h=0,night=0,wend=0,days=0,pl=0,cost=0;
 for(let d=1;d<=D;d++){const id=gv(st,d),s=sh(id);cost+=cellCost(st,id);
  if(isWork(id)){days++;h+=hrs(s);night+=nightH(s)}else if(isPL(id))pl+=id==='PL'?1:.5;else if([0,6].includes(dow(d)))wend++}
 return{st,h,night,wend,days,pl,cost}})}
const dayCost=d=>S.staff.reduce((a,s)=>a+cellCost(s,gv(s,d)),0);
function pbudget(){const a=pstart();return S.span==='m1'?S.budget:S.budget*dim()/new Date(a.getFullYear(),a.getMonth()+1,0).getDate()}

/* ---- 労務チェック ---- */
function laborIssues(){const D=dim(),out=[],maxRun=+S.rules.maxRun||6,iv=+S.rules.interval||11,ST=stats();
 S.staff.forEach((st,i)=>{let run=0,runStart=0;
  for(let d=1;d<=D;d++){const id=gv(st,d);
   if(isWork(id)){if(!run)runStart=d;run++;if(run===maxRun+1)out.push({lv:'bad',st,d:runStart,t:`${run}連勤以上（${dlabel(runStart)}〜）`,k:'連勤'})}else run=0;
   if(wv(st,d)&&isWork(id))out.push({lv:'warn',st,d,t:`${mon(d)}/${dom(d)} 希望休の日に出勤が入っています`,k:'希望休'});
   if(d<D&&isWork(id)&&isWork(gv(st,d+1))){const a=tm(sh(id)),b=tm(sh(gv(st,d+1)));if(a&&b){const gap=24+b.a-a.b;if(gap<iv)out.push({lv:'warn',st,d,t:`${mon(d)}/${dom(d)}→翌日 勤務間隔 ${gap.toFixed(1)}時間（目安${iv}時間）`,k:'インターバル'})}}}
  // 週40時間（月曜始まり）
  let wkH=0,wkS=1;for(let d=1;d<=D;d++){if(dow(d)===1&&d>1){wkH=0;wkS=d}const id=gv(st,d);if(isWork(id))wkH+=hrs(sh(id));
   if((dow(d)===0||d===D)&&wkH>40){out.push({lv:'warn',st,d:wkS,t:`${dlabel(wkS)}の週 ${wkH.toFixed(1)}時間（週40時間超・時間外）`,k:'週40h'});wkH=-1e9}}
  // 社会保険：週20時間以上（賃金要件は2026年10月撤廃）
  // 51人以上の会社だけ：週20〜30時間未満・2ヶ月超の雇用見込み・学生でない（30時間以上は通常の加入者として扱う）
  if(S.company==='large'){const wh=ST[i].h/(D/7),L=LAW.shaho;if(wh>=L.minH&&wh<L.fullH&&st.longEmp!==false&&!st.student)out.push({lv:'warn',st,d:1,t:`週平均 ${wh.toFixed(1)}時間・${L.months}ヶ月超の雇用見込みあり・学生でないため、社会保険の加入対象です`,k:'社保'})}
  // 扶養ライン
  if(+st.fuyo>0){const a=pstart(),md=new Date(a.getFullYear(),a.getMonth()+1,0).getDate(),m=S.span==='m1'?ST[i].cost:ST[i].cost*md/D,lim=st.fuyo/12;
   if(m>lim)out.push({lv:'bad',st,d:1,t:`月収見込 ${yen(m)} が扶養ライン目安 ${yen(lim)}/月 を超えています`,k:'扶養'});
   else if(m>lim*.9)out.push({lv:'warn',st,d:1,t:`月収見込 ${yen(m)}（扶養ライン目安 ${yen(lim)}/月 の9割超）`,k:'扶養'})}});
 return out}

function shahoInfo(){if(S.company==='large')return'';
 if(S.company==='small')return`<div class="banner" style="margin-bottom:10px"><span class="chip">社会保険</span><span class="small">${LAW.shaho.smallNote}</span></div>`;
 return`<div class="banner warn" style="margin-bottom:10px"><span class="chip warn">社会保険</span><span class="small">会社全体の従業員数を設定してください。設定すると、週20時間以上の社会保険の判定ができます。</span>${adminOK?'<button class="b3" onclick="go(5)">設定を開く</button>':''}</div>`}

/* ---- 有給 ---- */
function plInfo(st){const t=todayD(),adj=+st.plAdj||0;
 const pend=R.filter(r=>r.type==='pl'&&r.status==='pending'&&r.staffId===st.id).reduce((a,r)=>a+(r.half?.5:1),0);
 if(!st.hire)return{grant:0,used:0,pend,remain:adj,base:'',end:'',first:'',obl:false,need5:0};
 const first=addM(st.hire,6);
 if(t<first)return{grant:0,used:0,pend,remain:adj,base:'',end:'',first:iso(first),obl:false,need5:0};
 let k=0;while(addM(st.hire,6+12*(k+1))<=t)k++;
 const base=addM(st.hire,6+12*k),end=addM(st.hire,6+12*(k+1)),wd=Math.min(5,Math.max(1,+st.wdays||5)),grant=PLT[wd][Math.min(k,6)];
 let used=0;Object.entries(S.grid[st.id]||{}).forEach(([d,v])=>{if(isPL(v)){const x=pd(d);if(x>=base&&x<end)used+=v==='PL'?1:.5}});
 const due=new Date(end-864e5),obl=grant>=10;
 return{grant,used,pend,remain:grant+adj-used,base:iso(base),end:iso(due),first:iso(first),obl,need5:obl?Math.max(0,5-used):0,daysToDue:Math.ceil((due-t)/864e5)}}

/* ===================== 予約（プロ） ===================== */
const resOf=d=>S.res.filter(r=>r.date===dk(d)).sort((a,b)=>a.time.localeCompare(b.time));
function badge(d){const r=resOf(d),n=r.reduce((a,x)=>a+(+x.n||0),0);if(!r.length)return`<span class="rb z" onclick="openRes(${d})">–</span>`;return`<span class="rb ${n>=20?'h':n>=10?'m':''}" title="予約 ${r.length}組 / ${n}名" onclick="openRes(${d})">${r.length}組<br>${n}名</span>`}
function openRes(d){resDay=d;drw()}function closeRes(){resDay=null;drw()}
function drw(){const el=$('dr');if(resDay==null||showLock){el.innerHTML='';return}const d=resDay,rs=resOf(d),n=rs.reduce((a,r)=>a+(+r.n||0),0);
 el.innerHTML=`<div class="dr fi"><div class="row between" style="align-items:flex-start;margin-bottom:16px"><div><h2 style="margin:0">${mon(d)}月${dom(d)}日（${WD[dow(d)]}）の予約</h2><div class="small muted">予約 ${rs.length}組 / ${n}名・出勤 ${workingOn(dk(d))}名</div></div><button class="b2" onclick="closeRes()">閉じる</button></div>
 <div class="stack">${rs.length?rs.map(r=>`<div class="tile"><div class="row between"><b>${esc(r.time)}　${esc(r.name)}</b><span>${esc(r.n)}名</span></div>${r.note?`<div class="small muted">${esc(r.note)}</div>`:''}</div>`).join(''):'<p class="muted small">予約はありません</p>'}</div>
 ${adminOK?`<button class="b" style="width:100%;margin-top:14px" onclick="closeRes();tab=0;av='res';render()">予約を追加・編集</button>`:''}</div>`}
function addRes(){const g=i=>$(i).value,d=g('f_rd'),nm=g('f_rn').trim();if(!d||!nm){toast('日付とお客様名を入力してください');return}S.res.push({id:'r'+Date.now(),date:d,time:g('f_rt')||'18:00',name:nm,n:+g('f_rc')||1,note:g('f_rm')});save();$('f_rn').value='';$('f_rm').value='';render(true)}
function tabRes(ed){const a=dk(1),b=dk(dim()),items=S.res.map((r,i)=>({...r,i})).filter(r=>r.date>=a&&r.date<=b).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)),by={};items.forEach(r=>(by[r.date]=by[r.date]||[]).push(r));
 const tot=items.reduce((x,r)=>x+(+r.n||0),0);
 let h=`<div class="card"><h2>予約状況（${plabel()}　${items.length}組 / ${tot}名）</h2>`;
 if(ed)h+=`<div class="row" style="align-items:flex-end"><label class="f">日付<input id="f_rd" type="date" value="${a}"></label><label class="f">時間<input id="f_rt" type="time" value="18:30"></label><label class="f">お客様名<input id="f_rn" placeholder="山田様"></label><label class="f">人数<input id="f_rc" type="number" min="1" style="width:80px" value="2"></label><label class="f">備考・コース<input id="f_rm"></label><button class="b" onclick="addRes()">予約を追加</button></div>`;
 h+='</div>';const ds=Object.keys(by);if(!ds.length)h+='<div class="card empty">この期間の予約はありません</div>';
 ds.forEach(x=>{const l=by[x],n=l.reduce((q,r)=>q+(+r.n||0),0);
  h+=`<div class="card tight"><div class="row" style="margin-bottom:6px"><b>${fmtD(x)}</b><span class="chip ${n>=20?'bad':n>=10?'warn':'a'}">予約 ${l.length}組 / ${n}名</span><span class="chip">出勤 ${workingOn(x)}名</span></div>`+l.map(r=>ed?`<div class="row" style="margin-bottom:4px"><input type="date" value="${r.date}" onchange="U('res.${r.i}.date',this.value)"><input type="time" value="${esc(r.time)}" onchange="U('res.${r.i}.time',this.value)"><input value="${esc(r.name)}" size="10" onchange="U('res.${r.i}.name',this.value)"><input type="number" min="1" style="width:70px" value="${esc(r.n)}" onchange="U('res.${r.i}.n',this.value,1)">名<input value="${esc(r.note)}" onchange="U('res.${r.i}.note',this.value)"><button class="b3 danger" onclick="S.res.splice(${r.i},1);save();render()">削除</button></div>`:`<div class="row small" style="padding:4px 0;border-top:1px solid var(--line)"><b style="width:3.5rem">${esc(r.time)}</b><span style="width:8rem">${esc(r.name)}</span><span style="width:3rem">${esc(r.n)}名</span><span class="muted">${esc(r.note)}</span></div>`).join('')+'</div>'});return h}

/* ===================== シフト表 ===================== */
function cellHTML(st,d,adm,alerts){const id=gv(st,d),s=sh(id),m=S.memo[st.id+'_'+dk(d)],w=wv(st,d),on=sel&&sel[0]===st.id&&sel[1]===d;
 if(!adm&&!isPub(d))return`<td class="cell np" title="未公開"></td>`;
 const colored=s&&(isWork(id)||isPL(id));
 const cls=['cell',adm?'ed':'',on?'sel':'',colored?'':dcls(d),colored?'':'offc',alerts&&alerts.has(st.id+'_'+d)?'alert':''].join(' ');
 return`<td class="${cls}" style="${colored?`background:${esc(s.color)};color:var(--cell-fg)`:''}" ${adm?`onclick="pick('${st.id}',${d})"`:''} title="${esc(m||'')}">${s?esc(s.name):''}${w?'<div class="w">希</div>':''}${m?'<span class="m">●</span>':''}</td>`}

function grid(adm){const showRes=can('res')&&S.res.length>0,D=dim(),al=new Set();if(adm)laborIssues().forEach(x=>{if(x.k==='連勤'||x.k==='希望休'||x.k==='インターバル')al.add(x.st.id+'_'+x.d)});

/* ===================== 管理者：申請・承認 ===================== */
const RT={pl:'有給休暇',off:'希望休',swap:'シフト交代'};
const RS={pending:['承認待ち','warn'],open:['交代相手を募集中','a'],approved:['承認済み','ok'],rejected:['却下','bad'],canceled:['取り消し','']};
const stName=id=>(S.staff.find(s=>s.id===id)||{}).name||'（削除されたスタッフ）';
function reqDetail(r){let t=`<b>${esc(stName(r.staffId))}</b>　${fmtD(r.date)}`;
 if(r.type==='pl')t+=r.half?'　半日':'　全日';
 if(r.type==='swap'){const s=sh(r.shiftId);t+=`　${esc(s?s.name:'')}${r.takerId?` → <b>${esc(stName(r.takerId))}</b> が引き受け`:''}`}
 return t}
function impact(r){if(r.type==='swap')return'';const cur=gvd(r.staffId,r.date);if(!isWork(cur))return'<span class="chip">この日は勤務なし</span>';const k=workingOn(r.date)-1,n=needOn(r.date);return`<span class="chip ${k<n?'bad':'ok'}">承認後の出勤 ${k}/${n}名</span>`}
async function approve(id){const r=R.find(x=>x.id===id);if(!r)return;const G=S.grid;
 if(r.type==='pl'){G[r.staffId]=G[r.staffId]||{};G[r.staffId][r.date]=r.half?'PLH':'PL'}
 else if(r.type==='off'){S.wish[r.staffId]=S.wish[r.staffId]||{};S.wish[r.staffId][r.date]=true;if(isWork(gvd(r.staffId,r.date))){G[r.staffId][r.date]=offId()}}
 else if(r.type==='swap'){if(!r.takerId){toast('引き受ける人がまだいません');return}G[r.staffId]=G[r.staffId]||{};G[r.takerId]=G[r.takerId]||{};G[r.staffId][r.date]=offId();G[r.takerId][r.date]=r.shiftId}
 save();if(await REQ.upd(id,{status:'approved',decidedAt:new Date().toISOString()}))toast('承認し、シフト表に反映しました');render()}
async function reject(id){const n=($('f_rj_'+id)||{}).value||'';if(await REQ.upd(id,{status:'rejected',decidedAt:new Date().toISOString(),note:n}))toast('却下しました')}
async function approveAll(){const ps=R.filter(r=>r.status==='pending'&&(r.type!=='swap'||r.takerId));for(const r of ps)await approve(r.id)}
function tabReqs(){if(!can('pl')&&!can('req'))return lockedCard('req');
 const pend=R.filter(r=>r.status==='pending').sort((a,b)=>a.date.localeCompare(b.date)),open=R.filter(r=>r.status==='open'),hist=R.filter(r=>!['pending','open'].includes(r.status)).sort((a,b)=>(b.decidedAt||b.createdAt||'').localeCompare(a.decidedAt||a.createdAt||'')).slice(0,40);
 const row=(r,act)=>{const p=r.type==='pl'?plInfo(S.staff.find(s=>s.id===r.staffId)||{}):null;
  return`<div class="li"><div class="body"><div class="row" style="margin-bottom:4px"><span class="chip a">${RT[r.type]}</span><span class="chip ${RS[r.status][1]}">${RS[r.status][0]}</span>${act?impact(r):''}${p&&act?`<span class="chip">有給残 ${p.remain}日 → ${p.remain-(r.half?.5:1)}日</span>`:''}</div><div>${reqDetail(r)}</div>${r.reason?`<div class="small muted">理由：${esc(r.reason)}</div>`:''}${r.note?`<div class="small muted">管理者メモ：${esc(r.note)}</div>`:''}<div class="xs muted">申請 ${r.createdAt?new Date(r.createdAt).toLocaleString('ja-JP'):''}</div></div>
  ${act?`<div class="row"><input id="f_rj_${r.id}" placeholder="却下理由（任意）" style="width:160px"><button class="b2 danger" onclick="reject('${r.id}')">却下</button><button class="b ok" onclick="approve('${r.id}')" ${r.type==='swap'&&!r.takerId?'disabled':''}>承認</button></div>`:''}</div>`};
 return`<div class="card"><div class="row between"><h2 style="margin:0">承認待ち <span class="dot" ${pend.length?'':'hidden'}>${pend.length}</span></h2>${pend.length>1?'<button class="b2" onclick="approveAll()">まとめて承認</button>':''}</div>
 <p class="small muted" style="margin-top:4px">承認すると、有給はシフト表に「有給」として入り、希望休は自動生成で休みに固定されます。交代は2人のシフトを入れ替えます。</p>
 <div class="list" style="margin-top:8px">${pend.length?pend.map(r=>row(r,1)).join(''):'<div class="empty">承認待ちの申請はありません。スタッフ画面の「申請」から有給・希望休・交代を出せます。</div>'}</div></div>
 ${open.length?`<div class="card"><h2>交代相手を募集中</h2><div class="list">${open.map(r=>row(r,0)).join('')}</div></div>`:''}
 <div class="card"><h2>履歴</h2><div class="list">${hist.length?hist.map(r=>row(r,0)).join(''):'<div class="empty">まだ履歴はありません</div>'}</div></div>`}

async function submitReq(){const st=S.staff.find(s=>s.id===me);if(!st)return;const type=$('f_qt').value,reason=($('f_qr')||{}).value||'';let date,r;
